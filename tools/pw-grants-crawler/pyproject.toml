[project]
name = "pw-grants-crawler"
version = "0.1.0"
description = "Bounded crawler for Poets & Writers contest and grant listings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
render = [
    "playwright>=1.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
pw-grants-crawl = "pw_grants_crawler.cli:main"
pw-profile-discover = "pw_grants_crawler.profile_cli:main"
gary-pw-worker = "pw_grants_crawler.worker:main"
gary-review-worker = "pw_grants_crawler.review_worker:main"
gary-review = "pw_grants_crawler.review:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pw_grants_crawler"]
