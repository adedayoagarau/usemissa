name: Refresh public URLs in IndexNow

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Submit every sitemap URL, not only those changed in the last day
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Follows the sitemap index into each child sitemap. The daily run sends
      # only calls and profiles whose lastmod moved in the last 26 hours, plus
      # the hub pages that change with them.
      - name: Submit changed URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: www.usemissa.com
          CHANGED_SINCE: ${{ inputs.full && '' || '--changed-since-hours 26' }}
        run: >-
          node scripts/indexnow-submit.mjs
          --sitemap
          $CHANGED_SINCE
          https://www.usemissa.com/
          https://www.usemissa.com/opportunities
          https://www.usemissa.com/journals
          https://www.usemissa.com/residencies
          https://www.usemissa.com/grants
          https://www.usemissa.com/presses
          https://www.usemissa.com/countries
          https://www.usemissa.com/methodology
          https://www.usemissa.com/about
