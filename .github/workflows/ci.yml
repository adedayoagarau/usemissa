name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check customer-facing Missa language
        run: npm run check:language

      - name: Check Missa design-system policy
        run: npm run check:design-system

      - name: Test
        run: npm test

      - name: Test web unit suite
        run: npm run test:unit --workspace=@missa/web

      - name: Install Playwright Chromium
        run: npm exec --workspace=@missa/web -- playwright install --with-deps chromium

      - name: Test organization access in the browser
        run: npm exec --workspace=@missa/web -- playwright test e2e/organization-access.spec.ts

      - name: Verify reconciled migration ledger is committed
        run: node scripts/verify-migration-journal.mjs
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_schema_check

      - name: Verify migration files match the target-schema order
        run: node scripts/verify-migration-parity.mjs

      - name: Check one-way package dependency (workspace-engine must never be imported by radar-engine)
        run: ./scripts/check-package-boundaries.sh

  e2e-relational:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missa
          POSTGRES_PASSWORD: missa
          POSTGRES_DB: missa_story_16_2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply reconciled target schema
        run: node scripts/apply-target-schema.mjs
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_story_16_2_ci

      - name: Seed Story 16.2 relational fixture
        run: node scripts/seed-story-16-2-e2e-opportunity.mjs
        env:
          DISPOSABLE_CREATOR_DATABASE_URL: postgres://missa:missa@localhost:5432/missa_story_16_2_ci

      - name: Install Playwright Chromium
        run: npm exec --workspace=@missa/web -- playwright install --with-deps chromium

      - name: Test relational surfaces against Postgres
        run: npm run test:e2e --workspace=@missa/web
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_story_16_2_ci
          MISSA_E2E_RELATIONAL: "1"

  target-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missa
          POSTGRES_PASSWORD: missa
          POSTGRES_DB: missa_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply reconciled target schema to clean Postgres
        run: npm run db:target-schema --workspace=@missa/db
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_schema

      - name: Test target schema contracts
        run: npm test --workspace=@missa/db

      - name: Build compatibility adapters
        run: npm run build

      - name: Test Radar compatibility writer against target schema
        run: npm test --workspace=@missa/radar-adapters
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_schema

      - name: Test Workspace compatibility writer against target schema
        run: npm test --workspace=@missa/workspace-engine
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_schema

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missa
          POSTGRES_PASSWORD: missa
          POSTGRES_DB: missa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test against a real Postgres connection (radar-adapters)
        run: npm test --workspace=@missa/radar-adapters
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_test

      - name: Test ingestion v2 durable shadow store against Postgres
        run: npm test --workspace=@missa/ingestion-v2
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_test

      - name: Test against a real Postgres connection (workspace-engine)
        run: npm test --workspace=@missa/workspace-engine
        env:
          DATABASE_URL: postgres://missa:missa@localhost:5432/missa_test
