name: Radar Daily Freshness & Lifecycle Reconciler

on:
  schedule:
    # Run every night at midnight UTC (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-freshness:
    name: Reconcile Deadlines & Source URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Freshness Reconciler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/run-daily-freshness.mjs
