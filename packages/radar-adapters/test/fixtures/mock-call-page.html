<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2026 International Arts & Writing Fellowship</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "2026 International Arts & Writing Fellowship",
    "image": {
      "@type": "ImageObject",
      "url": "https://example.org/images/fellowship-hero-official.jpg",
      "caption": "Fellowship Writing Studio Retreat",
      "width": 1200,
      "height": 800
    }
  }
  </script>
  <meta property="og:image" content="https://example.org/images/og-share-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Retreat cabins in the woods" />
</head>
<body>
  <header>
    <img src="https://example.org/nav/site-logo.png" class="navbar-logo" alt="Site Logo" width="150" height="50" />
  </header>
  <main>
    <figure class="hero-artwork">
      <img src="https://example.org/images/fellowship-call-poster.jpg" alt="Official Fellowship Poster" width="1000" height="750" />
      <figcaption>Photo by Maria Santos © 2026. All rights reserved.</figcaption>
    </figure>
    <!-- Tracking pixel that must be rejected -->
    <img src="https://analytics.example.org/tr?pixel=1" width="1" height="1" alt="pixel" />
    <!-- Stock photo that must be rejected -->
    <img src="https://images.unsplash.com/photo-12345" alt="Stock photo" width="800" height="600" />
  </main>
</body>
</html>
